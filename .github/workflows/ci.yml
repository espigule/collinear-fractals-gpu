name: CI

on:
  push:
    branches:
      - main
      - "upgrade/**"
      - "release*"
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/quality.yml
