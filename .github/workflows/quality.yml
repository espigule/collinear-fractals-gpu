# Shared by pull requests and Pages: deploy only after this complete gate passes.
name: Quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-and-reference:
    name: Core, schemas, staged site and Chromium
    runs-on: ubuntu-latest
    # Desktop/mobile and GPU checks have independent runners and time budgets.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qa.txt

      - name: Install locked QA dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-qa.txt

      - name: Core and data validation
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser regressions
        run: npm run test:browser

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 7

      - name: Artifact ignore policy
        run: |
          git check-ignore artifacts/qa/results/example.png
          git check-ignore node_modules/playwright/package.json
          git check-ignore site/index.html
          git check-ignore certificates/generated/foo.json
          ! git check-ignore examples/e_c4_overlap/config.json
          ! git check-ignore examples/trap_enclosure_n3/certificate_interior.json
          ! git check-ignore certificates/verified/example.json

  gpu:
    name: WebGL shader and CPU fallback regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qa.txt

      - name: Install locked QA dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-qa.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: WebGL shader and CPU fallback regressions
        run: npm run test:gpu

      - name: Preserve GPU failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qa/gpu
          if-no-files-found: ignore
          retention-days: 7

  swift:
    name: Swift reference package
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift package tests
        working-directory: swift
        run: swift test
